<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TheViralFinds</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f0, #fff, #fff5f0);
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #EE4D2D;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px rgba(238, 77, 45, 0.25);
    }
    .icon svg { width: 40px; height: 40px; fill: white; }
    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #EE4D2D;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #D73211; }
    .tips {
      margin-top: 24px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: left;
    }
    .tips h3 { font-size: 13px; color: #333; margin-bottom: 8px; }
    .tips ul { list-style: none; padding: 0; }
    .tips li { font-size: 12px; color: #666; padding: 4px 0; }
    .tips li::before { content: '💡 '; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>Looks like you've lost your internet connection. Your cached data is still available.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="tips">
      <h3>While you're offline:</h3>
      <ul>
        <li>Previously viewed dashboard data is cached</li>
        <li>You can review your affiliate links from cache</li>
        <li>Check your Wi-Fi or mobile data connection</li>
      </ul>
    </div>
  </div>
</body>
</html>
