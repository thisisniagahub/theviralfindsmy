<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheViralFinds</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #EE4D2D, #D73211);
      padding: 16px;
      text-align: center;
    }
    .header h1 { color: white; font-size: 16px; }
    .header p { color: rgba(255,255,255,0.8); font-size: 11px; margin-top: 4px; }
    .content { padding: 16px; }
    .product-info {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .product-name { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .product-price { font-size: 18px; font-weight: bold; color: #EE4D2D; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary { background: #EE4D2D; color: white; }
    .btn-primary:hover { background: #D73211; }
    .btn-secondary { background: #16213e; color: #e0e0e0; border: 1px solid #2a2d3e; }
    .btn-secondary:hover { background: #1e2240; }
    .generated-link {
      background: #0d1020;
      border-radius: 8px;
      padding: 10px;
      margin-top: 12px;
      word-break: break-all;
      font-size: 11px;
      font-family: monospace;
      display: none;
    }
    .generated-link.show { display: block; }
    .toast {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: #22c55e;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔗 TheViralFinds</h1>
    <p>Shopee Affiliate Link Generator</p>
  </div>
  <div class="content">
    <div id="productInfo" class="product-info" style="display: none;">
      <div id="productName" class="product-name"></div>
      <div id="productPrice" class="product-price"></div>
    </div>
    <button id="detectBtn" class="btn btn-primary">🔍 Detect Current Product</button>
    <button id="generateBtn" class="btn btn-secondary" disabled>🔗 Generate Affiliate Link</button>
    <button id="copyBtn" class="btn btn-secondary" style="display: none;">📋 Copy Link</button>
    <div id="generatedLink" class="generated-link"></div>
  </div>
  <div id="toast" class="toast">✅ Link copied to clipboard!</div>

  <script src="popup.js"></script>
</body>
</html>
