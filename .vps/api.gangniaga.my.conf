server {
 listen 80;
 server_name api.gangniaga.my;
 return 301 https://$host$request_uri;
}

server {
 listen 443 ssl;
 server_name api.gangniaga.my;

 ssl_certificate /etc/letsencrypt/live/api.gangniaga.my/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/api.gangniaga.my/privkey.pem;

 location /openclaw/ {
  add_header Access-Control-Allow-Origin "https://theviralfinds.vercel.app" always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-openclaw-model" always;
  add_header Access-Control-Allow-Credentials "true" always;

  if ($request_method = 'OPTIONS') {
   return 204;
  }

  proxy_pass http://127.0.0.1:18789/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_buffering off;
  limit_req zone=api burst=40 nodelay;
 }

 location / {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
